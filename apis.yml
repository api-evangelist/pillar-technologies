name: Pillar Technologies
description: Pillar Technologies provides construction jobsite risk management through
  environmental monitoring and data analytics. Its wireless, rugged "Pod" sensors measure
  eight environmental metrics on the jobsite (temperature, humidity, carbon monoxide,
  VOCs, particulates, noise, light, and pressure) with cellular connectivity and a
  one-year battery life, feeding a real-time software platform with customizable
  dashboards, floorplan integration, and drill-down reporting by site, floor, or sensor.
  A configurable alert system notifies teams via text, email, or phone. Pillar serves
  data centers, hospitality and multi-family housing, and science and healthcare
  construction projects to improve safety and protect schedules and budgets. Surfaced
  as a Techstars portfolio company. No public developer API, documentation, or developer
  portal was found as of this enrichment pass.
